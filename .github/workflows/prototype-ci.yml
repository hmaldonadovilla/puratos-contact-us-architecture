name: Prototype CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  setup-and-build:
    name: ${{ matrix.os }} setup and build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, audit and build
        run: node scripts/setup.mjs
